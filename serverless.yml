service: saree-grace-backend

frameworkVersion: '3'

useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  architecture: arm64
  region: ${opt:region, 'ap-south-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 25
  logRetentionInDays: 30
  apiGateway:
    binaryMediaTypes:
      - 'multipart/form-data'
  environment:
    NODE_ENV: ${env:NODE_ENV, 'production'}
    API_BASE_PATH: ${env:API_BASE_PATH, '/api/v1'}
    CORS_ORIGINS: ${env:CORS_ORIGINS, ''}
    MONGODB_URI: ${env:MONGODB_URI, ''}
    JWT_ACCESS_SECRET: ${env:JWT_ACCESS_SECRET, ''}
    JWT_REFRESH_SECRET: ${env:JWT_REFRESH_SECRET, ''}
    JWT_ACCESS_EXPIRES_IN: ${env:JWT_ACCESS_EXPIRES_IN, '15m'}
    JWT_REFRESH_EXPIRES_IN: ${env:JWT_REFRESH_EXPIRES_IN, '30d'}
    GOOGLE_CLIENT_ID: ${env:GOOGLE_CLIENT_ID, ''}
    CLOUDINARY_CLOUD_NAME: ${env:CLOUDINARY_CLOUD_NAME, ''}
    CLOUDINARY_API_KEY: ${env:CLOUDINARY_API_KEY, ''}
    CLOUDINARY_API_SECRET: ${env:CLOUDINARY_API_SECRET, ''}
    CLOUDINARY_UPLOAD_FOLDER: ${env:CLOUDINARY_UPLOAD_FOLDER, 'saree-grace'}
    RAZORPAY_KEY_ID: ${env:RAZORPAY_KEY_ID, ''}
    RAZORPAY_KEY_SECRET: ${env:RAZORPAY_KEY_SECRET, ''}
    RAZORPAY_WEBHOOK_SECRET: ${env:RAZORPAY_WEBHOOK_SECRET, ''}
    PASSWORD_RESET_TOKEN_EXPIRES_MIN: ${env:PASSWORD_RESET_TOKEN_EXPIRES_MIN, '30'}
    OTP_EXPIRY_MINUTES: ${env:OTP_EXPIRY_MINUTES, '5'}
    OTP_MAX_ATTEMPTS: ${env:OTP_MAX_ATTEMPTS, '5'}
    OTP_RESEND_COOLDOWN_SECONDS: ${env:OTP_RESEND_COOLDOWN_SECONDS, '60'}
    EMAIL_HOST: ${env:EMAIL_HOST, ''}
    EMAIL_PORT: ${env:EMAIL_PORT, '587'}
    EMAIL_SECURE: ${env:EMAIL_SECURE, 'false'}
    EMAIL_USER: ${env:EMAIL_USER, ''}
    EMAIL_PASSWORD: ${env:EMAIL_PASSWORD, ''}
    EMAIL_FROM_NAME: ${env:EMAIL_FROM_NAME, 'Saree Grace'}
    EMAIL_FROM_ADDRESS: ${env:EMAIL_FROM_ADDRESS, ''}
    APP_URL: ${env:APP_URL, ''}
    SUPPORT_EMAIL: ${env:SUPPORT_EMAIL, ''}
    ABANDONED_CART_DELAY_HOURS: ${env:ABANDONED_CART_DELAY_HOURS, '24'}
    RATE_LIMIT_WINDOW_MS: ${env:RATE_LIMIT_WINDOW_MS, '900000'}
    RATE_LIMIT_MAX: ${env:RATE_LIMIT_MAX, '300'}
    AUTH_RATE_LIMIT_WINDOW_MS: ${env:AUTH_RATE_LIMIT_WINDOW_MS, '900000'}
    AUTH_RATE_LIMIT_MAX: ${env:AUTH_RATE_LIMIT_MAX, '10'}
    PAYMENT_RATE_LIMIT_WINDOW_MS: ${env:PAYMENT_RATE_LIMIT_WINDOW_MS, '900000'}
    PAYMENT_RATE_LIMIT_MAX: ${env:PAYMENT_RATE_LIMIT_MAX, '30'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: 'arn:aws:logs:*:*:*'

custom:
  serverless-offline:
    httpPort: 4000
    noPrependStageInUrl: true

plugins:
  - serverless-offline

package:
  individually: false
  patterns:
    - '!src/**'
    - '!tests/**'
    - '!scripts/**'
    - '!docs/**'
    - '!coverage/**'
    - '!.github/**'
    - '!.husky/**'
    - '!*.md'
    - '!.env*'
    - '!tsconfig*.json'
    - '!eslint*'
    - '!jest*'
    - '!.prettier*'

functions:
  api:
    handler: dist/lambda.handler
    events:
      - http:
          method: ANY
          path: /
          cors: false
      - http:
          method: ANY
          path: /{proxy+}
          cors: false
  abandonedCartJob:
    handler: dist/jobs/abandonedCartHandler.handler
    timeout: 60
    events:
      - schedule: rate(1 hour)